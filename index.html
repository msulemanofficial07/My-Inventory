<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>My Personal Inventory</title>
<style>
:root{
  --bg:#eef3fb;--card:rgba(255,255,255,.9);--text:#172033;--muted:#687386;--line:#e4eaf3;
  --primary:#2563eb;--primary2:#1d4ed8;--success:#16a34a;--danger:#dc2626;
  --warning:#d97706;--shadow:0 24px 55px rgba(15,23,42,.12);--radius:22px
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#f7faff 0%,#edf3fb 40%,#eaf0f6 100%);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(180deg,#0f172a,#111827 60%,#0b1120);color:#fff;padding:22px 14px;position:fixed;left:0;top:0;bottom:0;z-index:20;border-right:1px solid rgba(148,163,184,.2)}
.brand{padding:8px 12px 24px}.brand h1{font-size:20px;margin:0 0 4px}.brand p{font-size:12px;color:#9ca3af;margin:0}
.nav button{display:flex;width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px;border-radius:12px;text-align:left;margin:3px 0;gap:11px;align-items:center;transition:.2s ease;border-left:3px solid transparent}.nav button:hover{background:#1b2638;color:#fff;transform:translateX(2px)}.nav button.active{color:#fff;transform:translateX(2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.nav button[data-page="dashboard"].active{background:#193457;border-left-color:#60a5fa}.nav button[data-page="inventory"].active{background:#183b35;border-left-color:#4ade80}.nav button[data-page="journeys"].active{background:#45351b;border-left-color:#fbbf24}.nav button[data-page="checklists"].active{background:#173b43;border-left-color:#2dd4bf}.nav button[data-page="shopping"].active{background:#43283b;border-left-color:#f472b6}.nav button[data-page="history"].active{background:#303346;border-left-color:#a5b4fc}.nav .icon{width:24px;text-align:center}
.main{margin-left:250px;width:calc(100% - 250px);padding:28px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px;padding:14px 18px;background:rgba(255,255,255,.68);border:1px solid rgba(148,163,184,.25);backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 10px 25px rgba(15,23,42,.05)}.topbar h2{margin:0;font-size:28px}.topbar p{margin:4px 0 0;color:var(--muted);font-size:13px}
.primary,.secondary,.danger{border:0;border-radius:12px;padding:10px 15px;font-weight:650;transition:.2s ease}.primary{background:linear-gradient(135deg,var(--primary),#3b82f6);color:white;box-shadow:0 10px 18px rgba(37,99,235,.25)}.primary:hover{background:linear-gradient(135deg,var(--primary2),#2563eb)}.secondary{background:#eef2ff;color:#334155}.secondary:hover{background:#e2e8ff}.danger{background:#fee2e2;color:#991b1b}.danger:hover{background:#fecaca}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat{background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}.stat .n{font-size:30px;font-weight:750}.stat .l{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-top:18px}.card h3{margin:0 0 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{min-width:180px;flex:1}
input,select,textarea{border:1px solid #d8dee8;border-radius:11px;padding:10px 12px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#93b4ff;box-shadow:0 0 0 3px #dbeafe}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:650;background:#eef2ff;color:#3730a3}.badge.green{background:#dcfce7;color:#166534}.badge.orange{background:#ffedd5;color:#9a3412}.badge.red{background:#fee2e2;color:#991b1b}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cfd6e2;border-radius:14px}.small{font-size:12px;color:var(--muted)}.item-thumb{width:46px;height:46px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:8px;border:1px solid var(--line)}.link-button{border:0;background:transparent;color:var(--primary);padding:0;text-align:left;font-weight:650}.link-button:hover{text-decoration:underline}.daily-list{display:block;counter-reset:daily-number;list-style:none;margin:0;padding-left:34px}.daily-list li{display:list-item;counter-increment:daily-number;position:relative;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.daily-list li::before{content:counter(daily-number) '.';position:absolute;left:-30px;top:10px;color:var(--primary);font-weight:800;font-size:16px}.daily-list li:last-child{border-bottom:0}.daily-actions{float:right;display:flex;gap:6px}.daily-add{float:right;padding:6px 10px;font-size:12px}.checklist-input{display:flex;align-items:center;gap:8px;margin:8px 0}.checklist-input>span{min-width:22px;color:var(--primary);font-weight:800}.checklist-input input{flex:1;min-width:0}.add-check-item{margin-top:6px}
.dashboard-link{border:0;background:transparent;color:var(--text);padding:0;font:inherit;font-weight:750;text-align:left;cursor:pointer}.dashboard-link:hover{color:var(--primary)}
.dashboard-panel{border-top:4px solid transparent}.dashboard-panel.journey-panel{border-top-color:#d99a16;background:linear-gradient(180deg,#fffaf0 0%,var(--card) 35%)}.dashboard-panel.reminder-panel{border-top-color:#db5b91;background:linear-gradient(180deg,#fff5fa 0%,var(--card) 35%)}.dashboard-panel.checklist-panel{border-top-color:#159b91;background:linear-gradient(180deg,#f0fcfa 0%,var(--card) 35%)}.dashboard-panel.journey-panel .dashboard-link:hover{color:#a16207}.dashboard-panel.reminder-panel .dashboard-link:hover{color:#be185d}.dashboard-panel.checklist-panel .dashboard-link:hover{color:#0f766e}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modal-box{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#f1f5f9;border-radius:10px;padding:7px 11px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650;color:#475569}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.item-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item-check{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:9px;align-items:center}.item-check input{width:auto}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--primary);width:0}.journey-card{border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px}.journey-head{display:flex;justify-content:space-between;gap:10px}.journey-title{font-weight:750}.journey-meta{font-size:12px;color:var(--muted);margin:4px 0 12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.numbered-items{padding-left:28px}.numbered-items li{padding-left:4px}.numbered-items li::marker{color:var(--primary);font-weight:800}
.picker-section{margin-top:14px}.picker-section h4{margin:0 0 8px;font-size:13px;color:#475569;font-weight:750}.picker-section .item-list{margin-top:0}
.mobile-menu{display:none}.save-note{font-size:12px;color:var(--muted);margin:0 0 14px}.save-note strong{color:var(--success)}
.live-clock{font-size:14px;color:var(--text);text-align:right;white-space:nowrap;padding:7px 10px;border:1px solid #c9d5e5;border-radius:10px;background:#e8eef7;font-weight:650;box-shadow:0 3px 10px rgba(15,23,42,.06)}
.topbar-actions{display:flex;align-items:center;gap:12px}.live-clock{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.25}.live-clock .clock-time{font-size:14px}.live-clock .clock-date{font-size:12px;font-weight:500;color:var(--muted)}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%;padding:18px}.mobile-menu{display:inline-flex}.grid{grid-template-columns:repeat(2,1fr)}.item-list{grid-template-columns:1fr}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat .n{font-size:24px}.topbar{align-items:flex-start}.topbar h2{font-size:22px}.topbar p{font-size:11px;line-height:1.3;max-width:210px}.topbar>.primary{padding:9px 10px;white-space:nowrap}.live-clock{padding:6px 8px}.live-clock .clock-time{font-size:13px}.live-clock .clock-date{font-size:11px}.form-grid,.two{grid-template-columns:1fr}.card{padding:15px}.toolbar{display:grid;grid-template-columns:1fr}.toolbar input,.toolbar select{min-width:0;width:100%}.toolbar .primary{width:100%}.table-wrap{overflow:visible}table{min-width:0}table thead{display:none}table,tbody,tr,td{display:block;width:100%}tr{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}td{border:0;padding:5px 0}td:nth-child(2)::before{content:'Quantity: ';color:var(--muted)}.actions{flex-wrap:wrap}.actions button{flex:1}}
@media(max-width:560px){.daily-add{float:none;margin:8px 0 0;display:block}.daily-list li{display:block}.daily-actions{float:none;flex-shrink:0;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:100%}.daily-actions button{padding:7px 8px;font-size:12px}}
</style>
</head>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><h1>📦 My Personal Inventory</h1><p>Items • Locations • Journeys • Packing</p></div>
  <nav class="nav">
    <button class="active" data-page="dashboard">🏠 <span>Dashboard</span></button>
    <button data-page="inventory">📦 <span>My Inventory</span></button>
    <button data-page="journeys">🧳 <span>Journeys</span></button>
    <button data-page="checklists">☑️ <span>Checklists</span></button>
    <button data-page="shopping">🛒 <span>Reminders</span></button>
    <button data-page="history">📜 <span>History</span></button>
  </nav>
</aside>

<main class="main">
  <div class="topbar">
    <div style="display:flex;gap:10px;align-items:center">
      <button class="secondary mobile-menu" onclick="toggleSidebar()">☰</button>
      <div><h2 id="pageTitle">Dashboard</h2><p id="pageSub">A simple personal system for tracking your belongings and journeys.</p></div>
    </div>
    <div class="topbar-actions"><div id="liveDateTime" class="live-clock"></div><button id="newChecklistButton" class="primary" onclick="openChecklistModal()">+ New Checklist</button></div>
  </div>
  <div id="content"></div>
</main>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">Add Item</h3><button class="close" onclick="closeModal()">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const KEY='personalInventoryV1';
function viewShopping(){
  const reminders=(db.shopping||[]).filter(item=>!item.hideFromShopping);
  return `<div class="card"><div class="toolbar"><button class="primary" onclick="openShoppingModal()">+ Add Reminder</button></div>${reminders.map(reminderCard).join('')||'<div class="empty">Create a reminder for something you want to remember, buy, or do later.</div>'}</div>`;
}
function reminderCard(reminder){const items=reminder.items||[];const done=items.filter(item=>item.done).length;const status=reminder.status==='Completed'?'Completed':'Planning';const loc=locName(reminder.locationId||'');return `<div class="journey-card"><div class="journey-head"><div><div class="journey-title">📝 ${esc(reminder.name)}</div><div class="journey-meta">${loc?`${esc(loc)} • `:''}${fmtDate(reminder.date)} • ${done}/${items.length} items • ${status}</div></div><span class="badge ${status==='Completed'?'green':'orange'}">${status}</span></div><div class="progress"><div style="width:${items.length?Math.round(done/items.length*100):0}%"></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="openShoppingModal('${reminder.id}')">Open / Edit</button><button class="secondary" onclick="toggleReminderStatus('${reminder.id}')">${status==='Planning'?'Mark as Done':'Mark as Planning'}</button><button class="danger" onclick="deleteShopping('${reminder.id}')">Delete</button></div></div>`;}
function toggleReminderStatus(id){const reminder=db.shopping.find(item=>item.id===id);if(!reminder)return;reminder.status=reminder.status==='Planning'?'Completed':'Planning';save();render('shopping')}
function deleteShopping(id){if(confirm('Delete this reminder?')){db.shopping=db.shopping.filter(x=>x.id!==id);save();render('shopping')}}
function openShoppingModal(reminderId){
  const reminder=db.shopping.find(item=>item.id===reminderId) || {id:'',name:'',date:new Date().toISOString().slice(0,10),items:[],notes:''};
  const title=reminderId ? 'Edit Reminder' : 'New Reminder';
  openModal(title,`<form onsubmit="saveShopping(event,'${reminderId||''}')"><div class="form-grid"><div class="field"><label>Reminder title *</label><input id="rName" required value="${esc(reminder.name||'')}" placeholder="e.g. Buy new charger / Remember gift / Need soap"></div><div class="field"><label>Date *</label><input id="rDate" type="date" required value="${reminder.date||new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Notes</label><input id="rNotes" value="${esc(reminder.notes||'')}" placeholder="Optional details or reminder reason"></div></div><div class="field full" style="margin-top:12px"><label>Items to remember</label><div id="reminderExtras">${(reminder.items||[]).filter(item=>item.extra || !item.itemId).map((item,index)=>`<div class="checklist-input"><span>${index+1}.</span><input name="reminderExtra" value="${esc(item.text||'')}" placeholder="Item ${index+1}"><button type="button" class="danger" onclick="removeReminderExtra(this)">Remove</button></div>`).join('')||`<div class="checklist-input"><span>1.</span><input name="reminderExtra" placeholder="e.g. toothpaste / gift / charger"><button type="button" class="danger" onclick="removeReminderExtra(this)">Remove</button></div>`}</div><button type="button" class="secondary add-check-item" onclick="addReminderExtra()">+ Add Item</button></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save Reminder</button></div></form>`);
}
function addReminderExtra(){const list=document.getElementById('reminderExtras'),n=list.children.length+1;list.insertAdjacentHTML('beforeend',`<div class="checklist-input"><span>${n}.</span><input name="reminderExtra" placeholder="Item ${n}"><button type="button" class="danger" onclick="removeReminderExtra(this)">Remove</button></div>`) }
function removeReminderExtra(button){button.parentElement.remove();document.querySelectorAll('#reminderExtras .checklist-input').forEach((row,index)=>row.querySelector('span').textContent=`${index+1}.`)}
const defaults={categories:['Personal Things','Daily Things'],locations:[],items:[],journeys:[],shopping:[],checklists:[]};
const dailyThingGroups=[
  {label:'Laptop + Bag',matches:['laptop','bag']},
  {label:'Books, Notebook, Sheets, Marker & Pen',matches:['book','notebook','sheet','marker','pen']},
  {label:'ID Card & Stapler',matches:['id card','idcard','stapler']},
  {label:'Clothes + Bunain & Lalkash',matches:['clothe','bunain','lalkash']},
  {label:'Shirts + Gyms / Trousers',matches:['shirt','gym','trouser']},
  {label:'Perfume',matches:['perfume']},
  {label:'Pillow, Blanket',matches:['pillow','blanket']},
  {label:'Chappals, Shoes, Boots',matches:['chapal','chapli','shoe','boot']},
  {label:'Toothpaste + Toothbrush & Miswak',matches:['toothpaste','toothbrush','miswak']},
  {label:'Soap, Shampoo, Face Wash',matches:['soap','shampoo','face wash']},
  {label:'Hair Oil, Comb',matches:['hair oil','comb','hair brush']},
  {label:'Beard Trimmer + Scissors',matches:['beard trimmer','scissor']},
  {label:'Razor, Nail Cutter',matches:['razor','nail cutter']},
  {label:'Tissue Paper',matches:['tissue']},
  {label:'Iron + Gas',matches:['iron','gas']}
];
function dailyThingGroup(item){const name=(item.name||'').toLowerCase();return dailyThingGroups.find(group=>group.matches.some(match=>name.includes(match)))?.label||''}
function load(){try{const stored=JSON.parse(localStorage.getItem(KEY));if(!stored)return structuredClone(defaults);return {...structuredClone(defaults),...stored,categories:stored.categories||structuredClone(defaults.categories),locations:stored.locations||[],items:stored.items||[],journeys:stored.journeys||[],shopping:stored.shopping||[],checklists:stored.checklists||[]}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
let db=load();
if(!db.items.length){db.items=structuredClone(defaults.items);save()}
if(!db.categoryLabelsSetupV1){
  db.items.forEach(item=>{if(item.category==='Daily Use')item.category='Personal Things';if(item.category==='Hostel Use')item.category='Daily Things'});
  db.categoryLabelsSetupV1=true;
  save();
}
if(!db.dailyThingsSetupV1){
  db.dailyThingsSetupV1=true;
  save();
}
if(!db.checklistResetV1){
  db.checklists=db.checklists.filter(checklist=>!['check-daily','check-hostel'].includes(checklist.id));
  db.items.forEach(item=>{if(['check-daily','check-hostel'].includes(item.checklistId))item.checklistId=''});
  db.checklistResetV1=true;
  save();
}
const dailyNames=['Mobile','Headphones','Wallet','CNIC','Visa Card','Glasses','Sunglasses','Watch','Pen','Hair Band','Waistcoat','Chadar'];
let itemsUpdated=false;
db.items.forEach(item=>{if(!item.category){item.category=dailyNames.some(name=>item.name.toLowerCase().includes(name.toLowerCase()))?'Personal Things':'Daily Things';itemsUpdated=true}});
if(itemsUpdated)save();
if(!db.locationSetupV1){
  const hostel=db.locations.find(item=>item.id==='loc-hostel'||item.type==='Hostel');
  if(hostel)db.items.filter(item=>item.category==='Daily Things').forEach(item=>item.locationId=hostel.id);
  db.locationSetupV1=true;
  save();
}
if(!db.withMeSetupV1){
  let withMe=db.locations.find(item=>item.id==='loc-with-me'||item.name==='With Me');
  if(!withMe){withMe={id:'loc-with-me',name:'With Me',type:'Other',notes:'Things currently with me'};db.locations.push(withMe)}
  const home=db.locations.find(item=>item.id==='loc-home'||item.name==='Katta Khel — Home');
  if(home)db.items.filter(item=>item.locationId===home.id&&item.category==='Personal Things').forEach(item=>item.locationId=withMe.id);
  db.withMeSetupV1=true;
  save();
}
if(!db.dailyUseSetupV2){
  const keptDaily=['Mobile','Headphones','Wallet','CNIC','Visa Card','Glasses','Hair Band','Pen'];
  db.items.forEach(item=>{if(item.category==='Other')item.category='Daily Things'});
  db.dailyUseSetupV2=true;
  save();
}
if(!db.otherCategoryCleanupV1){
  db.items.forEach(item=>{if(item.category==='Other')item.category='Daily Things'});
  db.categories=(db.categories||[]).filter(category=>category!=='Other');
  db.otherCategoryCleanupV1=true;
  save();
}
if(!db.dailyUseSetupV3){
  const keptDaily=['Mobile','Headphones','Wallet','CNIC','Visa Card','Glasses','Hair Band','Pen'];
  db.items.forEach(item=>{
    const isKept=keptDaily.some(name=>item.name.toLowerCase().startsWith(name.toLowerCase()));
    if(isKept)item.category='Personal Things';
  });
  db.dailyUseSetupV3=true;
  save();
}
if(!db.dailyUseSetupV4){
  const watch=db.items.find(item=>item.name.toLowerCase().startsWith('watch'));
  if(watch)watch.category='Personal Things';
  db.dailyUseSetupV4=true;
  save();
}
if(!db.homeLocationSetupV1){
  const home=db.locations.find(item=>item.id==='loc-home'||item.name==='Katta Khel — Home');
  if(home){home.name='Home';home.type='Home';home.notes='Home location'}
  db.homeLocationSetupV1=true;
  save();
}

function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function locName(id){return db.locations.find(x=>x.id===id)?.name||'Unknown location'}
function itemName(id){return db.items.find(x=>x.id===id)?.name||'Unknown item'}
function fmtDate(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function updateLiveDateTime(){const now=new Date(),date=now.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}),time=now.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}),clock=document.getElementById('liveDateTime');clock.innerHTML=`<span class="clock-time">${time}</span><span class="clock-date">${date}</span>`}

function render(page='dashboard'){
  currentPage=page;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.getElementById('newChecklistButton').style.display='none';
  const titles={dashboard:['Dashboard','Your current belongings, journeys and reminders.'],inventory:['My Inventory','Everything you own, with quantity and current location.'],locations:['Locations','Places where your belongings can be stored or moved.'],journeys:['Journeys','Plan, pack, record and later confirm return journeys.'],shopping:['Reminders','A simple reminder list for future purchases.'],checklists:['Checklists','Reusable personal preparation lists.'],history:['History','Your journey and checklist records, including active and completed records.']};
  document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];
  const views={dashboard:viewDashboard,inventory:viewInventory,locations:viewLocations,journeys:viewJourneys,shopping:viewShopping,checklists:viewChecklists,history:viewHistory};
  document.getElementById('content').innerHTML=views[page]();
  if(page==='inventory') bindInventory();
}
function navigate(page){
  if(page===currentPage)return;
  history.pushState({page},'',`${location.pathname}${location.search}#${page}`);
  render(page);
}
window.addEventListener('popstate',()=>{const page=location.hash.slice(1);render(['dashboard','inventory','locations','journeys','shopping','checklists','history'].includes(page)?page:'dashboard')});

  const selectedItems=new Set((checklist.items||[]).filter(item=>!item.extra).map(item=>item.itemId));
  const formTitle=checklistId ? 'Edit Checklist' : 'New Checklist';
  openModal(formTitle,`<form onsubmit="saveChecklist(event,'${checklistId||''}')"><div class="form-grid"><div class="field"><label>Checklist name *</label><input id="cName" required value="${esc(checklist.name||'')}" placeholder="e.g. Going to Hostel"></div><div class="field"><label>Location (custom)</label><input id="cLocation" value="${esc(checklist.locationName||'')}" placeholder="e.g. Hostel, Home, City, My Room"></div><div class="field"><label>Date *</label><input id="cDate" type="date" required value="${checklist.date||new Date().toISOString().slice(0,10)}"></div></div><div class="field full" style="margin-top:12px"><label>Checklist items: select items you have in this place</label><label class="item-check"><input id="selectAllChecklistItems" type="checkbox" checked onchange="toggleAllChecklistItems(this.checked)"> <strong>Select All Items</strong></label><div id="checklistItemPicker">${pickerSections('checklistItem', {selectedIds:[...selectedItems],defaultLocation:''})}</div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">${checklistId ? 'Save Checklist' : 'Create Checklist'}</button></div></form>`);
  updateSelectAllChecklistItems();
}
function toggleAllChecklistItems(value){document.querySelectorAll('input[name="checklistItem"]').forEach(input=>input.checked=value)}
function updateSelectAllChecklistItems(){const all=[...document.querySelectorAll('input[name="checklistItem"]')],selected=all.filter(input=>input.checked);const master=document.getElementById('selectAllChecklistItems');if(master)master.checked=all.length>0&&selected.length===all.length}
function addChecklistExtra(){const list=document.getElementById('checklistExtras'),number=list.children.length+1;list.insertAdjacentHTML('beforeend',`<div class="checklist-input"><span>${number}.</span><input name="checklistExtra" placeholder="Extra item ${number}"><button type="button" class="danger" onclick="removeChecklistExtra(this)">Remove</button></div>`)}
function removeChecklistExtra(button){button.parentElement.remove();document.querySelectorAll('#checklistExtras .checklist-input').forEach((row,index)=>row.querySelector('span').textContent=`${index+1}.`)}
function saveChecklist(e, checklistId){e.preventDefault();const name=document.getElementById('cName').value.trim(),date=document.getElementById('cDate').value,locationName=document.getElementById('cLocation').value.trim();if(!name||!date){alert('Please enter checklist name and date.');return}const items=[...document.querySelectorAll('input[name="checklistItem"]:checked')].map(input=>{const item=db.items.find(entry=>entry.id===input.value);return {itemId:input.value,text:item?.name||'Unknown item',done:false,locationName:locationName||item?.locationId||'',extra:false}}),extraItems=[...document.querySelectorAll('input[name="checklistExtra"]')].map(input=>input.value.trim()).filter(Boolean).map(text=>({text,done:false,locationName:locationName||'',extra:true}));if(!items.length&&!extraItems.length){alert('Select at least one item or add an extra item first.');return}if(checklistId){const checklist=db.checklists.find(item=>item.id===checklistId);if(!checklist)return;checklist.name=name;checklist.date=date;checklist.locationName=locationName;checklist.items=[...items,...extraItems];checklist.status='Planning';save();closeModal();render('checklists');return}db.checklists.push({id:uid('check'),name,date,locationName,items:[...items,...extraItems],status:'Planning'});save();closeModal();render('checklists')}
function pickerSections(inputName, options={}){const groups={};const selectedIds=new Set(options.selectedIds||[]);const locationId=options.defaultLocation||'';db.items.filter(item=>!item.journeyOnly&&(!locationId||item.locationId===locationId||!item.locationId)).forEach(item=>{const category=item.category||'Uncategorised';(groups[category]||(groups[category]=[])).push(item)});const row=item=>`<label class="item-check"><input type="checkbox" name="${inputName}" value="${item.id}" ${selectedIds.has(item.id)||!options.selectedIds?'checked':''} onchange="${inputName==='jItem'?'updateSelectAllJourneyItems()':'updateSelectAllChecklistItems()'}"> <span>${esc(item.name)} <span class="small">(${esc(locName(item.locationId))})</span></span></label>`;return Object.entries(groups).map(([category,items])=>{if(category!=='Daily Things')return `<div class="picker-section"><h4>${esc(category)} <span class="small">• ${items.length} items</span></h4><div class="item-list">${items.map(row).join('')}</div></div>`;const grouped=dailyThingGroups.map(group=>({label:group.label,items:items.filter(item=>dailyThingGroup(item)===group.label)})).filter(group=>group.items.length);return `<div class="picker-section"><h4>Daily Things <span class="small">• ${items.length} items</span></h4>${grouped.map(group=>`<div class="picker-section"><h4>${esc(group.label)}</h4><div class="item-list">${group.items.map(row).join('')}</div></div>`).join('')}</div>`}).join('')||'<div class="empty">Add inventory items first.</div>'}

function deleteJourney(id){const journey=db.journeys.find(x=>x.id===id);if(journey&&confirm('Remove this journey from Journeys? It will remain in History.')){journey.hideFromJourneys=true;journey.hideFromDashboard=true;save();render('journeys')}}
function deleteHistoryJourney(id){if(confirm('Delete this journey permanently from History?')){db.journeys=db.journeys.filter(x=>x.id!==id);save();render('history')}}
function deleteHistoryChecklist(id){if(confirm('Delete this checklist permanently from History?')){db.checklists=db.checklists.filter(x=>x.id!==id);db.items=db.items.filter(item=>item.checklistId!==id);save();render('history')}}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
document.querySelector('.main').addEventListener('pointerdown',()=>{if(window.matchMedia('(max-width: 900px)').matches)document.getElementById('sidebar').classList.remove('open')});
window.addEventListener('storage',event=>{if(event.key===KEY){db=load();render(currentPage)}});
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{navigate(b.dataset.page);document.getElementById('sidebar').classList.remove('open')}));

const initialPage=location.hash.slice(1);
render(['dashboard','inventory','locations','journeys','shopping','checklists','history'].includes(initialPage)?initialPage:'dashboard');
updateLiveDateTime();
setInterval(updateLiveDateTime,1000);
</script>
</body>
